version: "3.8"
services:
  backend:
    build:
      context: ./app
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - MOUNT_POINT=/mnt/storage
      - SCAN_SCRIPT=/app/scripts/nas_scan.sh
      - DATABASE_URL=sqlite:////app/data/nas_metadata.db
    volumes:
      - ./app/data:/app/data
      - /mnt/Drive1:/mnt/storage
    restart: unless-stopped

  watcher:
    build:
      context: ./app
      dockerfile: backend/Dockerfile
    command: ["bash", "/app/scripts/nas_watch.sh"]
    environment:
      - MOUNT_POINT=/mnt/storage
      - DATABASE_URL=sqlite:////app/data/nas_metadata.db
    volumes:
      - ./app/data:/app/data
      - /mnt/Drive1:/mnt/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./app
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./app/frontend:/app/frontend
    restart: unless-stopped
